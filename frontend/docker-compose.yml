services:
  api:
    build:
      context: .
    container_name: job-scheduler-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: job-scheduler-db
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  k6:
    image: grafana/k6
    container_name: job-scheduler-k6
    volumes:
      - ./stress:/scripts
    entrypoint: ["sleep", "infinity"]

volumes:
  pgdata:
